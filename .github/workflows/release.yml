name: Release Obsidian plugin

on:
  push:
    tags: ["[0-9]*.[0-9]*.[0-9]*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - name: Use Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Verify release
        run: |
          bun -e 'import m from "./manifest.json"; import p from "./package.json"; if (m.version !== p.version || m.version !== process.env.GITHUB_REF_NAME) throw new Error("Release tag, manifest and package versions must match");'
          bun run typecheck
          bun run lint
          bun test

      - name: Build plugin
        run: bun run build

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"

          gh release create "$tag" \
            --title="$tag" \
            --draft \
            main.js manifest.json
