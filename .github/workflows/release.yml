name: Release Obsidian plugin

on:
  push:
    tags: ["[0-9]*.[0-9]*.[0-9]*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Verify release
        run: |
          bun -e 'import m from "./manifest.json"; import p from "./package.json"; if (m.version !== p.version || m.version !== process.env.GITHUB_REF_NAME) throw new Error("Release tag, manifest and package versions must match");'
          bun run typecheck
          bun run lint
          bun test

      - name: Build plugin
        run: bun run build

      - name: Attest plugin build
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: main.js

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"

          gh release create "$tag" \
            --title="$tag" \
            --draft \
            main.js manifest.json
